name: Flutter Android CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Decode Android keystore from GitHub Secret
      - name: Decode Android keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/upload-keystore.jks

      # Create key.properties
      - name: Create key.properties
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/upload-keystore.jks
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Build AAB
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/app-$VERSION.apk"

      - name: Rename AAB
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          cp build/app/outputs/bundle/release/app-release.aab \
             "build/app/outputs/bundle/release/app-$VERSION.aab"

      # Upload artifacts for every push
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 14

      - name: Upload AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-*.aab
          retention-days: 14

      # Create GitHub Release only for vX.Y.Z tags
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-*.apk
            build/app/outputs/bundle/release/app-*.aab
